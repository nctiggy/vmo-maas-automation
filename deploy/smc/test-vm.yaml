# Test namespace + VM for smc. The VM carries no MAC and no serial: KubeMacPool and Kyverno
# supply them. VLAN 25 is tagged only on smc12/smc13, hence the node affinity.
# Starts with runStrategy Manual; power it on through its own Redfish endpoint.
apiVersion: v1
kind: Namespace
metadata:
  name: maas-vms
  labels:
    mutatevirtualmachines.kubemacpool.io: allocate
    bmc.spectrocloud.com/autogen: enabled
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: maas-vlan25-br1
  namespace: maas-vms
spec:
  config: '{"cniVersion":"0.3.1","name":"maas-vlan25-br1","plugins":[{"type":"bridge","bridge":"br1","vlan":25,"mtu":1500,"isGateway":false,"ipMasq":false,"ipam":{}},{"type":"tuning","sysctl":{"net.ipv6.conf.IFNAME.disable_ipv6":"1","net.ipv6.conf.all.disable_ipv6":"1","net.ipv6.conf.default.disable_ipv6":"1"}}]}'
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: mvt1
  namespace: maas-vms
spec:
  runStrategy: Manual
  dataVolumeTemplates:
    - metadata:
        name: mvt1-root
        labels: {spindle-test: throwaway}
      spec:
        source: {blank: {}}
        storage:
          accessModes: [ReadWriteMany]
          volumeMode: Block
          storageClassName: spindle-rwx-block
          resources: {requests: {storage: 30Gi}}
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [smc12, smc13]}
      domain:
        cpu: {cores: 2}
        memory: {guest: 4Gi}
        firmware:
          bootloader: {efi: {secureBoot: false}}
        devices:
          disks:
            - {name: root, bootOrder: 2, disk: {bus: virtio}}
          interfaces:
            - {name: pxe, bootOrder: 1, model: virtio, bridge: {}}
      networks:
        - {name: pxe, multus: {networkName: maas-vlan25-br1}}
      terminationGracePeriodSeconds: 5
      volumes:
        - {name: root, dataVolume: {name: mvt1-root}}
